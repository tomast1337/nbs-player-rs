<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Rust Wasm NBS Player</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 1200px;
        }

        canvas {
            width: 80vw;
            height: auto;
            background-color: #00000000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        /* Style when in fullscreen */
        :fullscreen canvas {
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0;
            border: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .song-info {
            margin: 10px 0;
            font-size: 1.2rem;
            font-weight: bold;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            min-width: 100px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .playlist {
            margin-top: 20px;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;

            /*
            Style the scrollbar
            */
            scrollbar-width: 48px;
            scrollbar-color: #00bcd4 #2a2a40;
        }

        .playlist-item {
            padding: 8px 15px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-item.current {
            background: rgba(0, 188, 212, 0.3);
            font-weight: bold;
        }

        .playlist-item.current::before {
            content: "▶";
            margin-right: 10px;
            color: #00bcd4;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #aaa;
        }

        footer a {
            color: #00bcd4;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #00e5ff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Rust Wasm NBS Player</h1>
        <div class="song-info" id="songInfo">Loading...</div>
        <canvas tabindex="1" id="canvas"></canvas>
        <div class="controls">
            <button id="prevBtn">Previous</button>
            <button id="nextBtn">Next</button>
        </div>
        <div class="playlist" id="playlist"></div>
        <script>
            // ADD THE <script src="./target/wasm32-unknown-emscripten/release/nbs-player-rs.js"> TAG TO THE PAGE
            const scriptTag = document.createElement("script");
            scriptTag.src = "./target/wasm32-unknown-emscripten/release/nbs-player-rs.js";

            // Append the script tag to the body
            document.body.appendChild(scriptTag);

            const themes = [
                {
                    background_color: "#7EC850", // Grass-like green
                    accent_color: "#FF6A00", // Orange (like Minecraft's iconic dirt/wood)
                    text_color: "#F0F0F0", // Light gray
                    white_key_color: "#F5F5DC", // Beige (like sand)
                    black_key_color: "#3B2F2F", // Dark brown (like wood)
                    white_text_key_color: "#1A1A1A", // Dark gray
                    black_text_key_color: "#F0F0F0" // Light gray
                },
                {
                    background_color: "#2E1A1A", // Dark red-brown
                    accent_color: "#FF0000", // Blood red
                    text_color: "#E0E0E0", // Light gray
                    white_key_color: "#444444", // Dark gray
                    black_key_color: "#1A1A1A", // Near black
                    white_text_key_color: "#E0E0E0", // Light gray
                    black_text_key_color: "#FF0000" // Blood red
                },
                {
                    background_color: "#6B4423", // Brown (like wood)
                    accent_color: "#8B4513", // Saddle brown
                    text_color: "#FAFAD2", // Light goldenrod
                    white_key_color: "#D2B48C", // Tan (like parchment)
                    black_key_color: "#3B2F2F", // Dark brown
                    white_text_key_color: "#1A1A1A", // Dark gray
                    black_text_key_color: "#FAFAD2" // Light goldenrod
                },
                {
                    background_color: "#4B0082", // Indigo (magical night sky)
                    accent_color: "#FFD700", // Gold (like treasure)
                    text_color: "#E6E6FA", // Lavender
                    white_key_color: "#F0E68C", // Khaki (like parchment)
                    black_key_color: "#483D8B", // Dark slate blue
                    white_text_key_color: "#1A1A1A", // Dark gray
                    black_text_key_color: "#E6E6FA" // Lavender
                },
                {
                    background_color: "#0A0A1E", // Deep space blue
                    accent_color: "#00FF00", // Neon green
                    text_color: "#FFFFFF", // Pure white
                    white_key_color: "#1E1E1E", // Dark gray
                    black_key_color: "#000000", // Pure black
                    white_text_key_color: "#00FF00", // Neon green
                    black_text_key_color: "#FFFFFF" // Pure white
                },
                {
                    background_color: "#FF6F61", // Coral pink
                    accent_color: "#00CED1", // Bright turquoise
                    text_color: "#FFFFFF", // Pure white
                    white_key_color: "#FFD700", // Gold
                    black_key_color: "#00008B", // Dark blue
                    white_text_key_color: "#000000", // Black
                    black_text_key_color: "#FFFFFF" // Pure white
                },
                {
                    background_color: "#228B22", // Forest green
                    accent_color: "#8A2BE2", // Blue violet (magical accents)
                    text_color: "#F0FFF0", // Honeydew
                    white_key_color: "#F5DEB3", // Wheat (like tree bark)
                    black_key_color: "#2F4F4F", // Dark slate gray
                    white_text_key_color: "#1A1A1A", // Dark gray
                    black_text_key_color: "#F0FFF0" // Honeydew
                },
                {
                    background_color: "#1A1A2E", // Deep purple-blue
                    accent_color: "#FF007F", // Bright pink
                    text_color: "#00FFFF", // Cyan
                    white_key_color: "#333333", // Dark gray
                    black_key_color: "#000000", // Pure black
                    white_text_key_color: "#00FFFF", // Cyan
                    black_text_key_color: "#FF007F" // Bright pink
                },
                {
                    background_color: "#8B7355", // Burnt sienna
                    accent_color: "#DAA520", // Goldenrod
                    text_color: "#FFF8DC", // Cornsilk
                    white_key_color: "#F5F5DC", // Beige
                    black_key_color: "#654321", // Dark brown
                    white_text_key_color: "#1A1A1A", // Dark gray
                    black_text_key_color: "#FFF8DC" // Cornsilk
                },
                {
                    background_color: "#87CEEB", // Sky blue
                    accent_color: "#FF69B4", // Hot pink
                    text_color: "#FFFFFF", // Pure white
                    white_key_color: "#E6E6FA", // Lavender
                    black_key_color: "#9370DB", // Medium purple
                    white_text_key_color: "#1A1A1A", // Dark gray
                    black_text_key_color: "#FFFFFF" // Pure white
                }
            ]

            const songs = [
                "Bad Piggies Theme.nbs",
                "bo en - My Time.zip",
                "Mesmerizer.zip",
                "Rush E.nbs",
                "turkish_march.nbs",
            ];

            // Store current song index in localStorage
            let currentSongIndex = localStorage.getItem('currentSongIndex');
            if (currentSongIndex === null) {
                currentSongIndex = 0;
            } else {
                currentSongIndex = parseInt(currentSongIndex);
                if (currentSongIndex >= songs.length) {
                    currentSongIndex = 0;
                }
            }

            const songInfoElement = document.getElementById('songInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const playlistElement = document.getElementById('playlist');

            function updateUI() {
                // Update song info
                songInfoElement.textContent = `Now Playing: ${songs[currentSongIndex]}`;

                // Update playlist display
                playlistElement.innerHTML = '';
                songs.forEach((song, index) => {
                    const item = document.createElement('div');
                    item.className = `playlist-item ${index === currentSongIndex ? 'current' : ''}`;
                    item.textContent = song;
                    item.addEventListener('click', () => {
                        loadSong(index);
                    });
                    playlistElement.appendChild(item);
                });
            }

            function loadSong(index) {
                currentSongIndex = index;
                localStorage.setItem('currentSongIndex', currentSongIndex);

                // Reload the page to play the new song
                location.reload();
            }

            function prevSong() {
                currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
                loadSong(currentSongIndex);
            }

            function nextSong() {
                currentSongIndex = (currentSongIndex + 1) % songs.length;
                loadSong(currentSongIndex);
            }

            prevBtn.addEventListener('click', prevSong);
            nextBtn.addEventListener('click', nextSong);

            let fullscreen_window_width = window.screen.width;
            let fullscreen_window_height = window.screen.height;
            // if window width is less than height, swap them
            if (fullscreen_window_width < fullscreen_window_height) {
                const temp = fullscreen_window_width;
                fullscreen_window_width = fullscreen_window_height;
                fullscreen_window_height = temp;
            }

            fullscreen_window_width = Math.floor(fullscreen_window_width * 0.5);
            fullscreen_window_height = Math.floor(fullscreen_window_height * 0.5);

            // 720p resolution
            const window_width = 1280;
            const window_height = 720;

            const arguments = {
                font_id: Math.floor(Math.random() * 6),
                window_width: fullscreen_window_width,
                window_height: fullscreen_window_height,
                theme: themes[Math.floor(Math.random() * themes.length)],
            };

            const canvas = document.getElementById("canvas");
            // if spacebar is pressed do not roll the screen
            canvas.addEventListener("keydown", function (event) {
                if (event.code === "Space") {
                    event.preventDefault();
                }
            });

            var Module = {
                canvas: canvas,
                arguments: [
                    JSON.stringify(arguments),
                ],
                noInitialRun: true,
                preInit: async function () {
                    updateUI();

                    // wait 2 seconds before starting
                    await new Promise(resolve => setTimeout(resolve, 200));
                    const song_url = `./test-assets/${songs[currentSongIndex]}`;
                    const response = await fetch(song_url);
                    const arrayBuffer = await response.arrayBuffer();
                    const byteArray = new Uint8Array(arrayBuffer);
                    FS.writeFile("/song.nbsx", byteArray);
                    callMain(Module.arguments);
                }
            };

            // Add keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.code === 'ArrowLeft') {
                    prevSong();
                } else if (e.code === 'ArrowRight') {
                    nextSong();
                }
            });
        </script>
    </div>

    <footer>
        <p>Powered by <a href="https://www.rust-lang.org/" target="_blank">Rust</a> and <a
                href="https://webassembly.org/" target="_blank">WebAssembly</a></p>
        <div class="dependencies">
            <p>Source code available on <a href="https://github.com/tomast1337/nbs-player-rs" target="_blank">GitHub</a>
        </div>
    </footer>
</body>

</html>
