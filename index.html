<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Rust Wasm NBS Player</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 1200px;
        }

        canvas {
            width: 90%;
            height: auto;
            background-color: #00000000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            /* no texture filter */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        /* Style when in fullscreen */
        :fullscreen canvas {
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0;
            border: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .song-info {
            margin: 10px 0;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .song-meta {
            margin: 15px 0;
            text-align: center;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .song-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #00bcd4;
        }

        .song-description {
            font-size: 1rem;
            color: #cccccc;
            hyphens: auto;
            max-width: 100%;
            margin: 0 auto;
            text-align: left;
            /* apply \n*/
            white-space: pre-wrap;
            /* apply \n*/
            word-break: break-word;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
            min-width: 100px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .playlist {
            margin-top: 20px;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            scrollbar-width: thin;
            scrollbar-color: #00bcd4 #2a2a40;
        }

        /* Custom scrollbar for WebKit browsers */
        .playlist::-webkit-scrollbar {
            width: 8px;
        }

        .playlist::-webkit-scrollbar-track {
            background: #2a2a40;
        }

        .playlist::-webkit-scrollbar-thumb {
            background-color: #00bcd4;
            border-radius: 4px;
        }

        .playlist-item {
            padding: 8px 15px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-item.current {
            background: rgba(0, 188, 212, 0.3);
            font-weight: bold;
        }

        .playlist-item.current::before {
            content: "▶";
            margin-right: 10px;
            color: #00bcd4;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
            max-width: 800px;
        }

        footer a {
            color: #00bcd4;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #00e5ff;
        }

        .theme-indicator {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .song-title {
                font-size: 1.4rem;
            }

            .controls {
                flex-direction: column;
                gap: 10px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Rust Wasm NBS Player</h1>
        <div class="song-info" id="songInfo">Loading...</div>
        <canvas tabindex="1" id="canvas"></canvas>
        <div class="controls">
            <button id="prevBtn">Previous</button>
            <button id="nextBtn">Next</button>
        </div>
        <div class="song-meta">
            <div class="song-description" id="songDesc"></div>
        </div>
        <div class="playlist" id="playlist"></div>
        <script defer src="./index.js"></script>
    </div>

    <footer>
        <p>Powered by <a href="https://www.rust-lang.org/" target="_blank">Rust</a> and <a
                href="https://webassembly.org/" target="_blank">WebAssembly</a></p>
        <div class="dependencies">
            <p>Source code available on <a href="https://github.com/tomast1337/nbs-player-rs" target="_blank">GitHub</a>
        </div>
        <p>
            Visit <a href="https://noteblock.world" target="_blank">
                noteblock.world
            </a> for more music made in Note block Studio.
        </p>
        <p>
            This project is a work in progress. If you have any suggestions or issues, please open an issue on GitHub.
        </p>
    </footer>
</body>

</html>
