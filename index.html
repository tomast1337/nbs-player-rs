<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Rust Wasm NBS Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        canvas {
            width: 80vw;
            height: auto;
            background-color: #000000;
            border-radius: 8px;
            border: 1px solid #444;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease-in-out;
        }

        canvas:focus {
            outline: none;
            transform: scale(1.02);
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #aaa;
        }

        footer a {
            color: #00bcd4;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #00e5ff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Rust Wasm NBS Player</h1>
        <canvas tabindex="1" id="canvas" width="1280" height="720"></canvas>
    </div>

    <footer>
        Powered by <a href="https://www.rust-lang.org/" target="_blank">Rust</a> and <a href="https://webassembly.org/"
            target="_blank">WebAssembly</a>
    </footer>

    <script>
        const arguments = {
            song_url: "./test-assets/Rush E.nbs",
            font_id: Math.floor(Math.random() * 6),
            window_width: 1280,
            window_height: 720,
        };

        var Module = {
            canvas: document.getElementById("canvas"),
            arguments: [
                JSON.stringify(arguments),
            ],
        };
    </script>
    <script src="./target/wasm32-unknown-emscripten/release/nbs-player-rs.js"></script>
</body>

</html>
