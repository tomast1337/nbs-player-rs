<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NBS Player (canvas)</title>
    <style>
        html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="1"></canvas>
    <script type="module">
        import init, { start } from "./pkg/nbs_player_canvas.js";
        await init();
        // Empty config = demo theme; fetch config.json / song.nbsx from next to this page.
        const config = await fetch("config.json").then(r => r.ok ? r.text() : "").catch(() => "");
        await start("canvas", config, "song.nbsx");
    </script>
</body>
</html>
