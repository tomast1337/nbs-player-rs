[package]
name = "nbs-player-wgpu"
version = "0.1.0"
edition = "2024"
description = "wgpu + winit frontend for the NBS player (native and web)"
license = "AGPL-3.0 license"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nbs-player-wgpu"
path = "src/main.rs"

[dependencies]
nbs-player-core = { path = "../nbs-player-core" }
wgpu = "30"
winit = "0.30"
fontdue = "0.9"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
log = "0.4.26"
web-time = "1"

[dev-dependencies]
# GLSL -> WGSL conversion (examples/convert_shaders.rs and its up-to-date test)
naga = { version = "30", features = ["glsl-in", "wgsl-out"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nbs-player-cpal = { path = "../nbs-player-cpal" }
pollster = "1"
simple_logger = "5.0.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
nbs-player-cpal = { path = "../nbs-player-cpal" }
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Response",
] }
