[package]
name = "nbs-player-wgpu"
version = "0.1.0"
edition = "2024"
description = "wgpu + winit frontend for the NBS player"
license = "AGPL-3.0 license"

[dependencies]
nbs-player-core = { path = "../nbs-player-core" }
wgpu = { version = "30", features = ["glsl"] }
winit = "0.30"
fontdue = "0.9"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
log = "0.4.26"
simple_logger = "5.0.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nbs-player-cpal = { path = "../nbs-player-cpal" }
