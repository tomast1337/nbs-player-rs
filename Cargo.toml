[package]
name = "nbs-player-rs"
version = "0.1.0"
edition = "2024"
description = "A simple NBS player written in Rust"
license = "AGPL-3.0 license"
repository = ""

[dependencies]
nbs-rs = { git = "https://github.com/tomast1337/nbs-rs.git"}
log = "0.4.26"
#kira = "0.10.4"
kira = {version = "0.10.4", default-features = false, features = ["flac", "mp3", "ogg", "symphonia", "wav"]}
zip = { version = "2.4.2" , default-features = false, features = [ "deflate" ] }
raylib = "5.5.0"
env_logger = "0.11.7"
serde = {version = "1.0.219",features = ["derive"]}
serde_json = "1.0.140"
reqwest = { version = "0.12.15", features = ["blocking"] }



#[lib]
#crate-type = ["cdylib", "rlib"]

