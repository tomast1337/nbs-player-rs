[workspace]
members = ["crates/nbs-player-core", "crates/nbs-player-cpal", "crates/nbs-player-macroquad", "crates/nbs-player-wgpu"]

[package]
name = "nbs-player-rs"
version = "0.1.0"
edition = "2024"
description = "A simple NBS player written in Rust"
license = "AGPL-3.0 license"
repository = ""

[dependencies]
nbs-rs = { git = "https://github.com/tomast1337/nbs-rs.git"}
nbs-player-core = { path = "crates/nbs-player-core" }
log = "0.4.26"
raylib = { version = "5.5.0", features = ["sdl"] }
env_logger = "0.11.7"
serde = {version = "1.0.219",features = ["derive"]}
serde_json = "1.0.140"
reqwest = { version = "0.12.15" }
simple_logger = "5.0.0"
libc = "0.2.171"
rand = "0.9.0"




#[lib]
#crate-type = ["cdylib", "rlib"]

# cpal 0.18 has no emscripten host; the raylib audio backend is used there.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
nbs-player-cpal = { path = "crates/nbs-player-cpal" }

# Small, fast-to-download wasm for the web builds (`--profile web`).
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
