[package]
name = "nbs-player-rs"
version = "0.1.0"
edition = "2024"
description = "A simple NBS player written in Rust"
license = "AGPL-3.0 license"
repository = ""

[dependencies]
nbs-rs = { git = "https://github.com/tomast1337/nbs-rs.git"}
log = "0.4.26"
zip = { version = "2.5.0" , default-features = false, features = [ "deflate" ] }
raylib = { version = "5.5.0", features = ["sdl"] }
env_logger = "0.11.7"
serde = {version = "1.0.219",features = ["derive"]}
serde_json = "1.0.140"
reqwest = { version = "0.12.15" }
simple_logger = "5.0.0"
libc = "0.2.171"
once_cell = "1.21.3"



#[lib]
#crate-type = ["cdylib", "rlib"]

